<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Navbar Final</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

<header class="navbar">
  <div class="nav-container">

    <!-- Liquid cursor glow -->
    <div class="cursor-glow"></div>

    <nav class="nav-links">
      <a class="active"><i data-lucide="sparkles"></i> Home</a>
      <a><i data-lucide="user"></i> About</a>
      <a><i data-lucide="layout-grid"></i> Projects</a>
      <a><i data-lucide="git-branch"></i> Skills</a>
      <a><i data-lucide="mail"></i> Contact</a>
    </nav>

  </div>
</header>

<section class="hero">

  <!-- LEFT TEXT -->
  <div class="hero-left">
    <p class="intro">HI, I'M</p>

    <h1 class="name">SINDHU S</h1>

    <h2 class="role">Software Engineer</h2>

    <div class="vine-line"></div>

    <p class="desc">
      Building intelligent systems with clean UI, smooth interaction,
      and a focus on human-centered design.
    </p>
  </div>

  <!-- 🔥 RIGHT VISUAL (MOVE HERE) -->
  <div class="visual-system">

    <!-- FLOW -->
    <div class="flow-lines">
      <svg viewBox="0 0 800 600" class="flow-svg">
        <path d="M0 420 C200 340, 420 500, 620 360 S800 300, 780 280" />
        <path d="M0 450 C200 380, 420 520, 620 400 S800 340, 780 320" />
        <path d="M0 480 C200 420, 420 560, 620 440 S800 380, 780 360" />
      </svg>

      <div class="flow-particles">
        <span style="top:60%; left:55%"></span>
        <span style="top:50%; left:65%"></span>
        <span style="top:40%; left:75%"></span>
        <span style="top:55%; left:80%"></span>
        <span style="top:45%; left:70%"></span>
      </div>
    </div>

    <!-- CIRCLE -->
    <div class="circle-system">
      <svg class="circle-svg" viewBox="0 0 300 300">
        <circle cx="150" cy="150" r="20" />
        <circle cx="150" cy="150" r="35" />
        <circle cx="150" cy="150" r="50" />
        <circle cx="150" cy="150" r="65" />
        <circle cx="150" cy="150" r="80" />
        <circle cx="150" cy="150" r="95" />
        <circle cx="150" cy="150" r="110" />
        <circle cx="150" cy="150" r="125" />
      </svg>

      <div class="circle-core"></div>
    </div>

  </div>

</section>

<script src="js/main.js"></script>

<script>
  lucide.createIcons();
</script>

</body>
</html>
